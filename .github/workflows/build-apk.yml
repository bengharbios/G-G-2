name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Ensure capacitor-cordova-android-plugins exists
        working-directory: _gg/android
        run: |
          mkdir -p capacitor-cordova-android-plugins/src/main/java
          echo 'ext { cdvPluginPostBuildExtras = {} }' > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo '// empty' > capacitor-cordova-android-plugins/build.gradle

      - name: Build Debug APK
        working-directory: _gg/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ggames-debug.apk
          path: _gg/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
