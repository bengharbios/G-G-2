name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  aapt2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: aapt2 link check
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d $ANDROID_HOME/platforms/android-3* | sort -V | tail -1)/android.jar
          echo "Build tools: $BT"
          echo "Android jar: $JAR"
          mkdir -p /tmp/aapt2out
          $BT/aapt2 compile --dir _gg/android/app/src/main/res -o /tmp/res.zip 2>&1 | tee /tmp/compile.log || true
          $BT/aapt2 link -I $JAR --manifest _gg/android/app/src/main/AndroidManifest.xml \
            -o /tmp/out.apk /tmp/res.zip --no-auto-version \
            --warn-manifest-validation 2>&1 | tee /tmp/link.log || true
          echo "== counts =="
          echo "not found: $(grep -c 'not found' /tmp/link.log || true)"
          echo "duplicate: $(grep -c 'duplicate\|Duplicate' /tmp/link.log || true)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aapt2-logs
          path: /tmp/*.log

  build:
    needs: aapt2-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure capacitor-cordova-android-plugins exists
        working-directory: _gg/android
        run: |
          mkdir -p capacitor-cordova-android-plugins/src/main/java
          echo 'ext { cdvPluginPostBuildExtras = {} }' > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo '// empty' > capacitor-cordova-android-plugins/build.gradle

      - name: Decode keystore from secret
        working-directory: _gg/android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Build Release APK (signed)
        working-directory: _gg/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Debug APK (unsigned)
        working-directory: _gg/android
        run: ./gradlew assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ggames-v1.2-release.apk
          path: _gg/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ggames-v1.2-debug.apk
          path: _gg/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
