  <body>
    <div id="root"></div>
    <script>
      // ─── G-G Phase Watcher + Pass-the-Phone overlay ───
      (function () {
        var PHASE_KEYWORDS = {
          NIGHT: ['nightfall', 'night start', 'werewolves hunt', 'seer checks', 'witch acts', 'seer check', 'witch act', 'الليلة', 'اللّيل', 'فحص العرّاف', 'الساحرة', 'الذئاب'],
          DAY: ['dawn report', 'day start', 'day discussion', 'day voting', 'exile vote', 'hunter shot', 'الفجر', 'النهار', 'التصويت', 'المناقشة', 'إطلاق الصياد']
        };
        function getPhase(text) {
          if (!text) return 'UNKNOWN';
          var lower = text.toLowerCase();
          for (var i = 0; i < PHASE_KEYWORDS.NIGHT.length; i++) {
            if (lower.indexOf(PHASE_KEYWORDS.NIGHT[i].toLowerCase()) !== -1) return 'NIGHT';
          }
          for (var j = 0; j < PHASE_KEYWORDS.DAY.length; j++) {
            if (lower.indexOf(PHASE_KEYWORDS.DAY[j].toLowerCase()) !== -1) return 'DAY';
          }
          return 'UNKNOWN';
        }
        function currentPhaseText() {
          var gr = document.querySelector('.game-room');
          if (!gr) return '';
          var selectors = ['.game-room-header [class*="phase"]', '[class*="PHASE"]', '[class*="phase-text"]', '.game-room-header h2'];
          for (var i = 0; i < selectors.length; i++) {
            var el = gr.querySelector(selectors[i]);
            if (el && el.innerText) return el.innerText;
          }
          var header = gr.querySelector('.game-room-header');
          return header ? header.innerText : '';
        }
        var lastPhase = null;
        function applyPhase() {
          var gr = document.querySelector('.game-room');
          if (!gr) return;
          var text = currentPhaseText();
          var phase = getPhase(text);
          if (phase !== lastPhase) {
            lastPhase = phase;
            gr.setAttribute('data-gg-phase', phase);
            gr.style.setProperty('--gg-phase-emoji', phase === 'NIGHT' ? '"🌙"' : phase === 'DAY' ? '"☀️"' : '""');
            // Show pass-the-phone overlay when phase changes
            if (phase !== 'UNKNOWN' && phase !== null) {
              showPassOverlay(phase);
            }
          }
        }
        // ─── Pass-the-phone overlay ───
        var overlayEl = null;
        var overlayTimer = null;
        function showPassOverlay(phase) {
          // Remove existing overlay
          if (overlayEl) { overlayEl.remove(); overlayEl = null; }
          if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
          // Create overlay
          overlayEl = document.createElement('div');
          overlayEl.setAttribute('gg-pass-overlay', '1');
          overlayEl.style.cssText = [
            'position: fixed',
            'inset: 0',
            'z-index: 9999',
            'background: ' + (phase === 'NIGHT' ? 'linear-gradient(180deg, #020F1A 0%, #021410 100%)' : 'linear-gradient(180deg, #0a2e1f 0%, #041F18 100%)'),
            'display: flex',
            'flex-direction: column',
            'align-items: center',
            'justify-content: center',
            'gap: 14px',
            'padding: 24px',
            'font-family: "Cairo", "Lato", sans-serif',
            'color: #feef91',
            'animation: gg-fade-in .35s ease-out'
          ].join(';');
          var icon = phase === 'NIGHT' ? '🌙' : '☀️';
          var title = phase === 'NIGHT' ? 'حلّ الليل' : 'أشرق النهار';
          var subtitle = phase === 'NIGHT' ? 'مرّر الهاتف للاعب التالي\nليقوم بدوره الليلي' : 'مرّر الهاتف للاعب التالي\nللمناقشة والتصويت';
          overlayEl.innerHTML =
            '<div style="font-size: 72px; line-height: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); animation: gg-pulse 2s ease-in-out infinite">' + icon + '</div>' +
            '<h2 style="color: #feef91; font-size: 26px; font-weight: 900; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,.85); -webkit-text-stroke: 1px #aa6e1f; paint-order: stroke fill">' + title + '</h2>' +
            '<p style="color: #9fc4b4; font-size: 14px; font-weight: 600; text-align: center; margin: 0; line-height: 1.6; white-space: pre-line">' + subtitle + '</p>' +
            '<button type="button" id="gg-pass-ok" style="margin-top: 18px; padding: 14px 28px; border: none; border-radius: 14px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 18px rgba(245,158,11,.35); display: flex; align-items: center; gap: 8px">✓ أنا جاهز</button>';
          document.body.appendChild(overlayEl);
          // Click handler
          var ok = overlayEl.querySelector('#gg-pass-ok');
          if (ok) ok.addEventListener('click', function () {
            if (overlayEl) { overlayEl.style.opacity = '0'; setTimeout(function(){ if (overlayEl) { overlayEl.remove(); overlayEl = null; } }, 350); }
            if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
          });
          // Auto-hide after 6 seconds
          overlayTimer = setTimeout(function () {
            if (overlayEl) { overlayEl.style.opacity = '0'; setTimeout(function(){ if (overlayEl) { overlayEl.remove(); overlayEl = null; } }, 350); }
          }, 6000);
        }
        // Poll every 500ms
        setInterval(applyPhase, 500);
        var mo = new MutationObserver(applyPhase);
        mo.observe(document.body, { childList: true, subtree: true, characterData: true });
        applyPhase();
      })();
    </script>
  </body>
